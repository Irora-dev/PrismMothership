<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Device wall — The Prism Mothership</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #030409; color: #e8edf4;
    font: 14px/1.5 -apple-system, "Plus Jakarta Sans", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 14px 20px; background: rgba(3,4,9,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px);
  }
  header h1 { font-size: 15px; margin: 0 14px 0 0; letter-spacing: 0.08em; }
  header h1 span { color: #00F0FF; }
  .paths { display: flex; flex-wrap: wrap; gap: 6px; }
  .paths button {
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    color: #a8b8cc; border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .paths button.active { background: rgba(0,240,255,0.14); border-color: rgba(0,240,255,0.4); color: #00F0FF; }
  .zoom { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8494a7; }
  .wall { display: flex; flex-wrap: wrap; gap: 28px; padding: 26px; align-items: flex-start; }
  .device { display: flex; flex-direction: column; gap: 8px; }
  .device .label { font-size: 12px; color: #a8b8cc; display: flex; gap: 8px; align-items: baseline; }
  .device .label b { color: #fff; font-size: 13px; }
  .device .label span { color: #64748b; font-family: ui-monospace, monospace; font-size: 11px; }
  .frame {
    border: 1px solid rgba(255,255,255,0.14); border-radius: 26px; overflow: hidden;
    background: #000; box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    transform-origin: top left;
  }
  .frame iframe { border: 0; display: block; background: #030409; }
</style>
</head>
<body>
<header>
  <h1>DEVICE <span>WALL</span></h1>
  <nav class="paths" id="paths"></nav>
  <label class="zoom">zoom
    <input id="zoom" type="range" min="0.3" max="1" step="0.05" value="0.55" />
    <output id="zoomOut">0.55</output>
  </label>
</header>
<div class="wall" id="wall"></div>
<script>
  const TARGET = new URLSearchParams(location.search).get("target") || "http://localhost:3588";
  const DEVICES = [
    { name: "iPhone SE", w: 375, h: 667 },
    { name: "iPhone 14 Pro", w: 393, h: 852 },
    { name: "iPhone 15 Pro Max", w: 430, h: 932 },
    { name: "Pixel 7", w: 412, h: 915 },
    { name: "iPad Mini · portrait", w: 768, h: 1024 },
    { name: "iPad Pro 11 · landscape", w: 1194, h: 834 },
  ];
  const PATHS = ["/", "/command", "/trade", "/claim", "/radio", "/charts", "/spectrum", "/how-it-works", "/burn", "/studio", "/contracts", "/links", "/dev", "/portfolio"];
  let path = "/";
  let zoom = 0.55;

  const wall = document.getElementById("wall");
  const nav = document.getElementById("paths");

  function render() {
    wall.innerHTML = "";
    for (const d of DEVICES) {
      const el = document.createElement("div");
      el.className = "device";
      el.innerHTML =
        '<div class="label"><b>' + d.name + "</b><span>" + d.w + "×" + d.h + "</span></div>" +
        '<div class="frame" style="width:' + d.w * zoom + "px;height:" + d.h * zoom + 'px">' +
        '<iframe src="' + TARGET + path + '" width="' + d.w + '" height="' + d.h + '" style="transform:scale(' + zoom + ');transform-origin:top left"></iframe>' +
        "</div>";
      wall.appendChild(el);
    }
    for (const b of nav.children) b.classList.toggle("active", b.dataset.path === path);
  }

  for (const p of PATHS) {
    const b = document.createElement("button");
    b.textContent = p;
    b.dataset.path = p;
    b.onclick = () => { path = p; render(); };
    nav.appendChild(b);
  }

  const zoomInput = document.getElementById("zoom");
  zoomInput.oninput = () => {
    zoom = Number(zoomInput.value);
    document.getElementById("zoomOut").value = zoom.toFixed(2);
    render();
  };

  render();
</script>
</body>
</html>
